<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Ticket Booking</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Book Movie Tickets</h1>
        
        <form id="bookingForm">
            <label for="movie">Select Movie:</label>
            <select id="movie" required>
                <option value="Movie 1">Movie 1</option>
                <option value="Movie 2">Movie 2</option>
                <option value="Movie 3">Movie 3</option>
                <option value="Movie 4">Movie 4</option>
            </select>

            <label for="tickets">Number of Tickets:</label>
            <input type="number" id="tickets" min="1" max="10" required>

            <label for="name">Your Name:</label>
            <input type="text" id="name" required>

            <label for="email">Your Email:</label>
            <input type="email" id="email" required>

            <button type="button" onclick="showSeats()">Choose Seats</button>
        </form>

        <div id="seatSelection" class="hidden">
            <h2>Select Your Seats</h2>
            <div class="seats">
                <!-- Seats grid will be generated here by JavaScript -->
            </div>
            <button type="button" onclick="bookSeats()">Book Selected Seats</button>
        </div>

        <div id="confirmation" class="hidden">
            <h2>Booking Confirmed!</h2>
            <p id="confirmationMessage"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
